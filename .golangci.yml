version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - unconvert

  exclusions:
    rules:
      # Tests assert on behaviour, not on the error of every helper call.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
