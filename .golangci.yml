version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - unconvert

  settings:
    errcheck:
      # A failed write to stdout or stderr cannot be usefully handled: there is
      # nowhere left to report it.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # Tests assert on behaviour, not on the error of every helper call.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
