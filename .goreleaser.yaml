version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: zabbix-ai-cli
    main: ./cmd/zabbix-ai-cli
    binary: zabbix-ai-cli
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/stufently/zabbix-ai-cli/internal/cli.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, SECURITY.md, docs/*, skills/**/*]

checksum:
  name_template: checksums.txt

dockers:
  - image_templates:
      - "ghcr.io/stufently/zabbix-ai-cli:{{ .Version }}"
      - "ghcr.io/stufently/zabbix-ai-cli:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--build-arg=VERSION={{ .Version }}"

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: true
